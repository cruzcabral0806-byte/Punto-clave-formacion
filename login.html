<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { 
            background-color: #f8fafc; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 1rem;
        }
        .login-card { 
            background: white; 
            padding: 2.5rem; 
            border-radius: 12px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.08); 
            width: 100%; 
            max-width: 400px; 
            text-align: center; 
            border: 1px solid #e2e8f0;
        }
        h2 { color: #122750; margin-bottom: 0.5rem; font-size: 1.6rem; }
        p.subtitle { color: #64748b; font-size: 0.9rem; margin-bottom: 1.5rem; }
        
        .form-group { text-align: left; margin-bottom: 1rem; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: bold; color: #0f172a; margin-bottom: 0.3rem; }
        
        input { 
            width: 100%; 
            padding: 0.8rem; 
            border: 1px solid #cbd5e1; 
            border-radius: 6px; 
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus { border-color: #0284c7; }

        button { 
            width: 100%; 
            padding: 0.85rem; 
            background: #0284c7; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            font-size: 1rem;
            font-weight: bold; 
            cursor: pointer; 
            margin-top: 0.5rem;
            transition: background 0.2s;
        }
        button:hover { background: #0369a1; }
        
        .error { 
            color: #ef4444; 
            background-color: #fef2f2;
            border: 1px solid #fecaca;
            padding: 0.6rem;
            border-radius: 6px;
            font-size: 0.85rem; 
            margin-top: 1rem; 
            display: none; 
        }

        .back-link {
            display: inline-block;
            margin-top: 1.5rem;
            color: #64748b;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .back-link:hover { color: #0284c7; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Acceso Administrador</h2>
        <p class="subtitle">Punto Clave Formación</p>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" placeholder="admin@ejemplo.com" required>
            </div>
            
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" id="btnLogin">
                <i class="fa-solid fa-right-to-bracket"></i> Iniciar Sesión
            </button>
        </form>

        <p class="error" id="errorMsg"></p>

        <a href="index.html" class="back-link">← Volver al sitio público</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAA_oi-Y-TVU6OT-ti6CPms8-1Rsvn5DH8",
            authDomain: "punto-clave-formacion.firebaseapp.com",
            projectId: "punto-clave-formacion",
            storageBucket: "punto-clave-formacion.firebasestorage.app",
            messagingSenderId: "469116413284",
            appId: "1:469116413284:web:55552558b94235f62e4671"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const loginForm = document.getElementById('loginForm');
        const errorMsg = document.getElementById('errorMsg');
        const btnLogin = document.getElementById('btnLogin');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const pass = document.getElementById('password').value.trim();

            errorMsg.style.display = 'none';
            btnLogin.disabled = true;
            btnLogin.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Entrando...';

            try {
                await signInWithEmailAndPassword(auth, email, pass);
                // Redirige al inicio activando el panel de edición
                window.location.href = "index.html?modo=editar";
            } catch (error) {
                errorMsg.style.display = 'block';
                btnLogin.disabled = false;
                btnLogin.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Iniciar Sesión';

                if (error.code === 'auth/invalid-credential' || error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                    errorMsg.innerText = "Correo o contraseña incorrectos.";
                } else if (error.code === 'auth/too-many-requests') {
                    errorMsg.innerText = "Demasiados intentos fallidos. Inténtalo más tarde.";
                } else {
                    errorMsg.innerText = "Error al conectar: " + error.message;
                }
            }
        });
    </script>
</body>
</html>
